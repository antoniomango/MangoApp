<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangoApp</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    color: #1f2430;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 6px;
  }
  p.sub {
    color: #6b7280;
    font-size: 14px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #ea7a2b;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg {
    margin-top: 16px;
    font-size: 14px;
    border-radius: 8px;
    padding: 10px 12px;
    display: none;
  }
  .msg.error { display: block; background: #fdecea; color: #b3261e; }
  .msg.ok { display: block; background: #e7f6ec; color: #1e7a34; }
  .links { margin-top: 8px; }
  .links a {
    display: block;
    padding: 10px 12px;
    margin-top: 8px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    text-decoration: none;
    color: #1f2430;
    font-size: 15px;
  }
  .links a:hover { background: #f4f5f7; }
</style>
</head>
<body>

<div class="card" id="card-recovery" style="display:none">
  <h1>Imposta nuova password</h1>
  <p class="sub">Account: <strong id="recovery-email">—</strong></p>
  <form id="form-recovery">
    <label for="pw1">Nuova password</label>
    <input type="password" id="pw1" minlength="6" required autocomplete="new-password">
    <label for="pw2">Conferma nuova password</label>
    <input type="password" id="pw2" minlength="6" required autocomplete="new-password">
    <button type="submit" id="btn-recovery">Salva nuova password</button>
  </form>
  <div class="msg" id="recovery-msg"></div>
</div>

<div class="card" id="card-home" style="display:none">
  <h1>MangoApp</h1>
  <p class="sub">Seleziona la tua area</p>
  <div class="links">
    <a href="responsabile.html">Responsabile</a>
    <a href="operatore.html">Operatore</a>
    <a href="ufficio.html">Ufficio</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script>
// SUPABASE_URL / SUPABASE_ANON arrivano da js/config.js (vedi commento lì).
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const cardRecovery = document.getElementById('card-recovery');
const cardHome = document.getElementById('card-home');
const recoveryMsg = document.getElementById('recovery-msg');
const recoveryEmailEl = document.getElementById('recovery-email');

function showMsg(el, text, kind) {
  el.textContent = text;
  el.className = 'msg ' + kind;
}

// Il link di recupero password di Supabase arriva con #access_token=...&type=recovery
// nell'hash dell'URL. Non ci affidiamo all'evento PASSWORD_RECOVERY di supabase-js (in
// pratica arriva come SIGNED_IN): leggiamo il tipo direttamente dall'hash, che è
// presente subito, in modo sincrono, prima ancora che il client Supabase finisca di
// processare la sessione in background.
const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const isRecoveryFlow = hashParams.get('type') === 'recovery' && hashParams.has('access_token');

if (isRecoveryFlow) {
  cardHome.style.display = 'none';
  cardRecovery.style.display = 'block';
} else {
  cardRecovery.style.display = 'none';
  cardHome.style.display = 'block';
}

// Il client supabase-js processa l'hash in background (detectSessionInUrl) e crea la
// sessione da usare con updateUser() più sotto. Quando è pronta, mostriamo l'email.
sb.auth.onAuthStateChange((event, session) => {
  if (isRecoveryFlow && session?.user?.email) {
    recoveryEmailEl.textContent = session.user.email;
  }
});

document.getElementById('form-recovery').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('btn-recovery');

  if (pw1.length < 6) {
    showMsg(recoveryMsg, 'La password deve avere almeno 6 caratteri.', 'error');
    return;
  }
  if (pw1 !== pw2) {
    showMsg(recoveryMsg, 'Le due password non coincidono.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Salvataggio...';
  const { error } = await sb.auth.updateUser({ password: pw1 });
  btn.disabled = false;
  btn.textContent = 'Salva nuova password';

  if (error) {
    showMsg(recoveryMsg, 'Errore: ' + error.message, 'error');
    return;
  }

  showMsg(recoveryMsg, 'Password aggiornata. Ora puoi accedere con la nuova password.', 'ok');
  document.getElementById('form-recovery').style.display = 'none';
  setTimeout(() => {
    cardRecovery.style.display = 'none';
    cardHome.style.display = 'block';
  }, 2000);
});
</script>

</body>
</html>
